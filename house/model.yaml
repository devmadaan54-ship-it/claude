# 17 Chandra Path - house model (source of truth)
#
# Transcribed from house/source/17C_original.pdf
# (Cadmax "Existing Residence Layout", Jaipur, Project AR/2024/DEC/01, dated 10/12/24).
#
# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------
# Units      : feet (decimal). 16'-6" is written 16.5. Original ft-in labels from
#              the drawing are kept as strings in `label` fields.
# Frame      : one shared frame for every floor, so floors stack on each other.
#              Origin (0,0) = outer top-left corner of the ground floor house walls.
#              +x goes right on the drawing, +y goes down on the drawing.
# Directions : "up/down/left/right" always mean drawing directions.
#              Per the compass on the sheets (rotated ~15-20 deg):
#                drawing up    = EAST  (rear boundary, y = 0)
#                drawing right = SOUTH (front lawn / porch side)
#                drawing down  = WEST  (parking + gates side)
#                drawing left  = NORTH (store & basement entry strip)
# box        : [x1, y1, x2, y2]  (top-left and bottom-right corners)
# rooms      : box = clear interior (inside faces of walls), approximate to ~0.3 ft
# walls      : box = full wall footprint. Openings are cut out of their wall.
# openings   : span = [from, to] measured along the wall's long axis
#              (x-range for horizontal walls, y-range for vertical walls).
#              type: door | double_door | window | ventilator | opening | glazed
#              opens: side the door leaf swings into (up/down/left/right).
# sill/lintel: heights from the drawing ("B.B." = lintel at bottom of beam).
# confidence : the drawing is dimensioned room-by-room, not with a full
#              structural grid, so positions are measured off the drawing scale.
#              Room sizes match the written dimensions; wall positions are
#              accurate to about +/- 4 inches. The terrace sheet is the least
#              precise (about +/- 2 ft against the floors below).
# ---------------------------------------------------------------------------

meta:
  name: 17 Chandra Path
  location: Jaipur, Rajasthan
  source: house/source/17C_original.pdf
  drawn_by: Cadmax Consultancy (P) Ltd., detailed by Yogesh Choudhary
  project_no: AR/2024/DEC/01
  drawing_date: 2024-12-10
  plot:
    size_label: 82'-5" x 47'-0" (left side 47'-1")
    area_sqft: 3820.73
  areas_sqft:
    basement_built_up: 1080.76
    ground_built_up: 2398.38
    first_built_up: 2117.72
    terrace_built_up: 330.89
    terrace_open: 2079.54
  levels_note: >
    FFL = finished floor level relative to the site datum. Ground floor has
    split levels: parking +18", entrance porch +42", main floor +60",
    rear stair landing +24".

vastu:
  # 3x3 grid (9 zones) laid over the whole plot. With this grid the ground
  # floor toilet next to the stair and the first floor toilet with the tub fall
  # in the centre zone.
  grid_box: [-7.00, 0.00, 75.40, 47.00]
  cells:
    - [NE, E, SE]
    - [N, Centre, S]
    - [NW, W, SW]
  note: >
    Vastu 3x3 grid over the whole plot. Zone names assume drawing up = East.
    The compass on the sheets is turned about 24 deg (East points up and a
    little to the left), so each named zone is really about 24 deg off.
  avoid:
    WC: [Centre, NE, SW]
    Stair: [Centre, NE, N, E]
    Lift: [Centre, NE]
    Cooking (hob): [NE, Centre, SW]
    Entrance door: [SW]

