# Design v1: Vastu changes
#
# A patch on model.yaml (the house as it exists). render.py applies it and
# draws design_v1.html. Everything added here is drawn in teal.
#
# Brief from the owner:
#   1. Move the main staircase (all floors) to the covered porch next to the office.
#   2. A small staircase in the dining area (here: the only way to the basement).
#   3. Merge the ground floor kitchen and bedroom into one bedroom.
#   4. Kitchen goes where the master bedroom is.
#   5. Vastu 3x3 zoning: get the WCs out of the centre zone.
#   6. Add a lift next to the new stair.
#   7. The old stair location becomes a grand entrance.
#   Keep it realistic for a load-bearing building.
#
# Assumptions used for sizing (to confirm):
#   ground (main floor +60") to first floor: 11'-0" floor to floor
#   basement floor to ground floor: about 9'-3"
#   home lift: 5'-6" x 5'-6" clear shaft (fits a 6 person car), pit about 4'

base: model.yaml
title: "Design v1: Vastu changes"

changes:
  - what: Main stair moved to the covered porch beside the office, as a new stair + lift tower serving ground, first floor and terrace.
    why: Takes the heavy stair out of the centre zone (Brahmasthan). The South zone is a good Vastu place for stairs and a lift.
    structure: >
      Built as its own RCC frame on new footings, outside the original
      load-bearing walls. The two existing porch pillars stay: the bottom one
      becomes the end of the stair's central spine wall. Two 4'-3" flights
      with 9 treads of 10" each, 10 risers of 6.6" per flight, 3'-6" landings.
      The core sticks out about 1'-6" into the lawn and 4' into the parking.
  - what: Home lift in the lawn, right next to the stair landing (5'-6" x 5'-6" clear shaft), stops at ground, first floor and terrace.
    why: Opens straight onto the stair landing on every floor. Sits in the South zone.
    structure: >
      6" RCC shaft walls on a raft with a pit about 4' deep. A machine-room-less
      lift needs an overrun of about 11' above the terrace landing. It does not
      reach the basement, because the basement is only under the north half of
      the house.
  - what: The covered entrance landing in front of the main door is enclosed as a Stair & Lift Lobby (floor raised to +60"), with a door from the front porch.
    why: Keeps the stair inside the house. The old main door now opens from the house into this lobby.
    structure: 9" brick walls on new strip footings, with a new roof slab at first floor level over the lobby.
  - what: The old stair hall (and the small toilet beside it) becomes the Grand Foyer, with a new 5'-0" double main door in the west wall facing the parking.
    why: >
      Owner's brief. The foyer is open space in the centre zone, which Vastu
      likes. The door is in the 4th/5th division (pada) of the west side counted
      from the south-west corner (Pushpadanta/Varuna), which is good.
    structure: >
      The stairwell openings in the ground floor slab (over the basement) and
      the first floor slab are filled with new RCC slab panels, carried on the
      existing stair walls plus one new beam each. The new door replaces the old
      rear door and window in the same wall, under one new RCC lintel. The
      glazed partition between the stair and dining is removed (not structural).
  - what: Entrance porch with 6 steps (7" risers) from the parking (+18") up to the foyer (+60").
    why: Gives the grand entrance an approach. It sits under the existing first floor terrace slab, which acts as its canopy.
    structure: Steps on a new plinth. This uses up the covered parking under the first floor terrace; cars move to the open parking either side.
  - what: Ground floor toilet next to the old stair becomes a shoe and coat closet. A new powder room (WC + basin) goes in the office's corner, entered from the stair landing.
    why: That toilet sat in the centre zone. The new WC is in the South zone. It is not under the stair, which Vastu also avoids.
    structure: 4.5" brick partitions on the existing floor. Needs an exhaust fan (no outside wall). The office loses about 20 sq ft and keeps its corner window.
  - what: Kitchen moved into the old M. Bedroom (16'-0" x 11'-0"). A new 3'-0" doorway links it to the dining room. The toilet door into this room is closed.
    why: >
      Owner's brief. Inside the room the sink is in its NE corner and the hob
      in its SE corner, so you cook facing East. A toilet must not open into a
      kitchen.
    structure: The doorway is cut in the 15" load-bearing wall under the first floor bedroom wall, so it needs an RCC lintel and short-term propping while it is cut.
  - what: Ground floor kitchen and bedroom merged into one Bedroom (24'-11" x 10'-5"). It now uses the old jack-and-jill toilet as its attached bath.
    why: Owner's brief.
    structure: >
      The wall removed is a 6" partition and is not load-bearing. The first
      floor wall above sits on an existing 9" deep beam, which stays as a
      dropped band in the ceiling. The old kitchen door is bricked up.
  - what: Small dog-leg stair (two 3'-0" flights) from the south side of the dining area down to the basement hall.
    why: Owner's brief. With the main stair gone, this is now the way into the basement.
    structure: >
      New 6'-4" x 8'-11" opening in the ground floor slab, between the
      basement's outer wall and its existing ceiling beam. Needs one new RCC
      trimmer beam on the open side. No first floor wall stands over it (the
      living room is open above).
  - what: "Basement: old stair removed. Its alcove becomes a store under the new foyer."
    structure: Slab over it as described above. The basement walls are unchanged.
  - what: "First floor: old stairwell slabbed over and turned into a Family Lounge off the living room. A new corridor runs from it to the new stair landing."
    why: Keeps the centre zone open. The corridor replaces the top part of the old tub bathroom.
    structure: >
      The corridor passes through the 9" wall between lounge and old bath (new
      3'-5" opening with an RCC lintel; this wall stands over a ground floor
      wall). It also passes through the old bath's outer 6" partition, which is
      shortened.
  - what: "First floor: the tub bathroom (centre zone) is taken out. A new attached bath for Bedroom 3 goes in the bedroom's south-west corner, with its WC in the South zone. The old bath area becomes a Utility / Laundry."
    why: Moves the WC out of the centre. The utility reuses the old sunken floor and drains.
    structure: >
      4.5" partitions inside Bedroom 3. The new bath has no sunken slab, so it
      needs a 6" raised floor. Its drain drops down the outside of the lobby wall
      below.
  - what: "First floor: rear balcony replaced by the stair core, the corridor and a small sit-out. Bedroom 3's door to that balcony is closed."
    structure: The balcony slab over the new core is rebuilt as part of the core (landings and flights).
  - what: Jack-and-jill toilets on both floors keep their place, but the WC moves to the lower end of each room.
    why: The top end of those rooms falls in the NE zone, where Vastu treats a WC as the worst defect. The lower end is in the North zone.
    structure: Re-plumbing inside the same room. No structural change.
  - what: "Terrace: old stair room demolished and its opening slabbed. New stair room and lift overrun over the new core. Pantry and terrace toilet kept for now."
    why: Keeps the roof over the centre zone open. Removing the stair room also takes load off the roof.
    structure: Pantry west wall stays as a solid outside wall.
  - what: "Not changed: your green sofa sketch and yellow marks on the office walls are still only notes (meaning not confirmed yet)."

floor_notes:
  basement: >
    Same Theater and Hall. Access is now by a small dog-leg stair coming down
    from the dining room into the top-right corner of the hall. The old stair
    is gone. Its alcove is a store and the area above is the new grand foyer.
  ground: >
    New grand entrance on the west (parking) side leads into a foyer where
    the old stair was. Kitchen in the old master bedroom, next to the dining
    room. Kitchen and bedroom merged into one long bedroom with the old
    jack-and-jill toilet attached. A small stair goes down from the dining
    room to the basement. The stair and lift tower stands on the old covered
    porch next to the office, reached through an enclosed lobby by the old
    main door.
  first: >
    The new stair and lift land in the old rear balcony. A corridor leads from
    them to a family lounge where the old stair was, open to the living room.
    Bedroom 3 gets a new attached bath in its south-west corner. The old tub
    bathroom becomes a utility / laundry.
  terrace: >
    The new stair room and lift overrun sit over the new core. The old stair
    room is demolished and its opening slabbed. The pantry and the terrace
    toilet are kept.

